# Phase 1 data preparation settings.
source:
  name: idd  # key into configs/classes.yaml -> sources
  # Kaggle mirror of IDD-Detection in YOLO format (CC BY-NC-SA 4.0, derived from IIIT Hyderabad's IDD).
  kaggle_dataset: redzapdos123/indian-driving-dataset-detections-yolov11
  # Folder containing the source data.yaml. null = auto-detect under `search_dir`.
  root: null
  search_dir: /kaggle/input
  # Where each split lives inside `root`; {split} is replaced by the split folder name.
  images_dir: "{split}/images"
  labels_dir: "{split}/labels"
  splits:          # our split name -> source folder name
    train: train
    val: val
    test: test

output:
  # Prepared dataset (symlinked images + remapped labels + data.yaml). On Kaggle use /kaggle/working/...
  dataset_dir: datasets/trafficlens_idd
  reports_dir: reports/data
  # symlink: no image copies (fits Kaggle's 20 GB working-dir limit). copy: real copies.
  link_mode: symlink

subset:
  seed: 42
  # Cap per split (null = keep all). Train is subsampled so a nano model trains within one Kaggle session.
  max_images:
    train: 18000
    val: null
    test: null
  # Images containing any of these classes are always kept (rare classes we care about).
  keep_all_with: [auto_rickshaw, bicycle]
  # Images with no remaining labels (background) may make up at most this fraction of a split.
  max_background_frac: 0.05
